name: Release

# Pushing a tag such as v1.2.0 builds the zip and publishes a GitHub release.
# Pushing to any branch, or running it manually (Actions tab > Release > Run workflow),
# only builds the zip and attaches it to the run as a downloadable artifact;
# no release is created.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the manual build (e.g. 1.2.0)'
        required: false
        default: 'dev'

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-dev}"
          else
            VERSION="dev-${GITHUB_SHA::7}"   # branch push: label the build with the commit
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Check the PowerShell script for syntax errors
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'Remove-StaleProfiles.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "::error file=Remove-StaleProfiles.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          Write-Host 'No syntax errors found.'

      - name: Build the zip and checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          NAME="Remove-StaleProfiles-${VERSION}"
          mkdir -p "dist/${NAME}"

          cp Remove-StaleProfiles.ps1 README.md "dist/${NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "dist/${NAME}/"; fi

          cd dist
          zip -r "${NAME}.zip" "${NAME}"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

          echo "Contents of ${NAME}.zip:"
          unzip -l "${NAME}.zip"

      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remove-StaleProfiles-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a hyphen (v1.2.0-beta1) are published as pre-releases
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac

          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --title "$TAG" \
            --generate-notes \
            $FLAGS
